name: Spring evidence

on:
  push:
    branches: [main]
    paths:
      - 'adapters/spring/**'
      - 'compiler/evidence/**'
      - 'examples/spring-evidence/**'
      - 'schemas/evidence.v1alpha1.schema.json'
      - 'schemas/spring-adapter-request.v1alpha1.schema.json'
      - 'tests/**'
      - '*.gradle.kts'
      - '.github/workflows/spring-evidence.yml'
  pull_request:
    paths:
      - 'adapters/spring/**'
      - 'compiler/evidence/**'
      - 'examples/spring-evidence/**'
      - 'schemas/evidence.v1alpha1.schema.json'
      - 'schemas/spring-adapter-request.v1alpha1.schema.json'
      - 'tests/**'
      - '*.gradle.kts'
      - '.github/workflows/spring-evidence.yml'

permissions:
  contents: read

jobs:
  spring-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.5'
      - name: Verify adapter process and Spring Gradle fixtures
        run: |
          python -m pip install -r tests/requirements.txt
          gradle --no-daemon --console=plain :spring-evidence:validatePlugins :spring-evidence:installDist :evidence-check:installDist
          python tests/check_spring_evidence.py
