name: Compiler contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate draft contracts
        run: |
          python -m pip install -r tests/requirements.txt
          python -m unittest discover -s tests -v
      - name: Audit test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install pip-audit==2.10.0
          "$RUNNER_TEMP/audit/bin/pip-audit" -r tests/requirements.txt
