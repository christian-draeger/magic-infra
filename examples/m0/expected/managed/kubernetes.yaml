{
  "apiVersion": "v1",
  "items": [
    {
      "apiVersion": "postgresql.cnpg.io/v1",
      "kind": "Cluster",
      "metadata": {
        "name": "primary-db"
      },
      "spec": {
        "bootstrap": {
          "initdb": {
            "database": "shop",
            "owner": "app",
            "secret": {
              "name": "shop-db-credentials"
            }
          }
        },
        "instances": 1,
        "storage": {
          "size": "1Gi"
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "api"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "api"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "api"
            }
          },
          "spec": {
            "containers": [
              {
                "env": [
                  {
                    "name": "SPRING_DATASOURCE_URL",
                    "value": "jdbc:postgresql://primary-db-rw:5432/shop"
                  },
                  {
                    "name": "SPRING_DATASOURCE_USERNAME",
                    "valueFrom": {
                      "secretKeyRef": {
                        "key": "username",
                        "name": "shop-db-credentials"
                      }
                    }
                  },
                  {
                    "name": "SPRING_DATASOURCE_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "key": "password",
                        "name": "shop-db-credentials"
                      }
                    }
                  }
                ],
                "image": "example.invalid/shop/api:fixture",
                "name": "api",
                "ports": [
                  {
                    "containerPort": 8080
                  }
                ]
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "api"
      },
      "spec": {
        "ports": [
          {
            "port": 8080,
            "targetPort": 8080
          }
        ],
        "selector": {
          "app": "api"
        }
      }
    }
  ],
  "kind": "List"
}
