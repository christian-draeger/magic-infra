schemaVersion: infra/v1alpha2
applicationId: compose-app
services:
  compose-app:
    imageRef: magic-infra-compose-app:fixture
    port: 8080
    healthPath: /actuator/health
resources:
  primary-db:
    kind: postgresql
    management: managed
    deletionPolicy: retain
    database: fixture
    secretRef: fixture-db
    storageSize: 1Gi
bindings:
  - serviceId: compose-app
    resourceId: primary-db
